name: docs

on:
  # Deploy once the tests have passed on main, with the coverage badge that run made (#166)
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # workflow_run: only a successful tests run for a push to main in this repository, not a fork's branch named main
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # the coverage badge artifact of the tests run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build documentation
        run: uvx --from mkdocs==1.6.1 mkdocs build --strict
      - name: Add the coverage badge
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # The tests run that triggered this deploy, or for a manual run the last successful one on main
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow tests.yml --branch main --event push --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if ! gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n coverage-badge -D site; then
            echo "::warning::No coverage badge in tests run $RUN_ID: the README coverage badge shows an error until the next deploy."
          fi
      - name: Upload Pages artifact
        if: github.event.repository.visibility == 'public' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    if: github.event.repository.visibility == 'public' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
