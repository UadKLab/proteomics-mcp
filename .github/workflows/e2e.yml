# End-to-end verification of the package as published on PyPI (#30), or of a TestPyPI dry run before tagging.
# Not a pull-request check: it downloads public data (Zenodo, PRIDE) and calls external
# services, so it runs on demand and weekly, against a released version.
name: e2e

on:
  workflow_dispatch:
    inputs:
      version:
        description: "proteomics-mcp version to install from PyPI (empty: latest)"
        required: false
        default: ""
        type: string
      index:
        description: "Where to get it: pypi, or testpypi to check a release dry run before tagging (needs version)"
        required: false
        default: pypi
        type: choice
        options: [pypi, testpypi]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300  # Windows needs about twice the 70-90 minutes of Linux; the job limit is 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        shell: bash
    env:
      PROTEOMICS_MCP_E2E_CACHE: ${{ github.workspace }}/.e2e-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Zenodo supplement, OpenMS BSA1.mzML, PXD000001 MGF and (3.11 legs) the PXD079916 timsTOF run.
      # Bump the version suffix when tests/e2e adds or changes an input.
      - name: Cache public test data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e-cache
          key: e2e-data-${{ runner.os }}-${{ matrix.python-version }}-v2

      - name: Install proteomics-mcp in a clean environment
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          VERSION: ${{ inputs.version }}
          INDEX: ${{ inputs.index || 'pypi' }}
        run: |
          if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like X.Y.Z"; exit 1
          fi
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/pypi-env"
          if [ "$RUNNER_OS" = "Windows" ]; then
            py="$RUNNER_TEMP/pypi-env/Scripts/python.exe"
          else
            py="$RUNNER_TEMP/pypi-env/bin/python"
          fi
          if [ "$INDEX" = testpypi ]; then
            if [ -z "$VERSION" ]; then echo "::error::index testpypi needs a version"; exit 1; fi
            # Only the proteomics-mcp wheel comes from TestPyPI, checked against its published SHA-256;
            # every dependency still comes from PyPI (TestPyPI names are not trustworthy).
            url_sha=$(curl -fsSL "https://test.pypi.org/pypi/proteomics-mcp/$VERSION/json" \
              | jq -r '.urls[] | select(.packagetype == "bdist_wheel") | "\(.url) \(.digests.sha256)"')
            read -r url sha <<< "$url_sha"
            wheel="$RUNNER_TEMP/${url##*/}"
            curl -fsSL -o "$wheel" "$url"
            "$py" -c 'import hashlib, sys; d = hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest(); print(d); sys.exit(d != sys.argv[2])' "$wheel" "$sha"
            uv pip install --python "$py" "$wheel" pytest
          else
            uv pip install --python "$py" --refresh "proteomics-mcp${VERSION:+==$VERSION}" pytest
          fi
          echo "PYPI_PY=$py" >> "$GITHUB_ENV"
          # Only the published package may be imported.
          rm -rf src

      - name: Run end-to-end checks
        env:
          PROTEOMICS_MCP_E2E_REPORT: ${{ runner.temp }}/e2e-report.json
          # the 522 MB timsTOF conversion runs once per OS
          PROTEOMICS_MCP_E2E_BRUKER: ${{ matrix.python-version == '3.11' && '1' || '0' }}
        run: '"$PYPI_PY" -m pytest -o pythonpath= -m e2e -rs --durations=15 tests/e2e'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/e2e-report.json
          if-no-files-found: warn
