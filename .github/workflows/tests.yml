name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check version consistency
        run: uv run --no-project python scripts/check_version.py

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Build sdist and wheel
        run: uv build

      - name: Check wheel contents
        run: uv run --no-project python scripts/check_wheel.py dist/*.whl

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    env:
      # One leg measures coverage of the installed package; it fails below fail_under in pyproject.toml (#166)
      COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install the built wheel in a clean environment
        run: |
          uv venv --python ${{ matrix.python-version }} "$RUNNER_TEMP/wheel-env"
          if [ "$RUNNER_OS" = "Windows" ]; then
            py="$RUNNER_TEMP/wheel-env/Scripts/python.exe"
          else
            py="$RUNNER_TEMP/wheel-env/bin/python"
          fi
          extra=""
          if [ "$COVERAGE" = true ]; then extra="pytest-cov"; fi
          uv pip install --python "$py" dist/*.whl pytest $extra
          echo "WHEEL_PY=$py" >> "$GITHUB_ENV"
          # Remove the source tree so nothing can be imported from it by accident.
          rm -rf src

      - name: Run tests against the installed package
        env:
          PROTEOMICS_MCP_TEST_INSTALLED: "1"
        run: |
          if [ "$COVERAGE" = true ]; then
            "$WHEEL_PY" -m pytest -o pythonpath= -rs --cov --cov-report=term
          else
            "$WHEEL_PY" -m pytest -o pythonpath= -rs
          fi

      - name: Coverage summary
        if: always() && env.COVERAGE == 'true'
        run: |
          {
            echo "## Coverage of the installed package (Python ${{ matrix.python-version }})"
            "$WHEEL_PY" -m coverage report --format=markdown --fail-under=0 | sed 's|[^ |]*site-packages/||'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: MCP stdio smoke test
        run: '"$WHEEL_PY" scripts/smoke_mcp.py --manifest manifest.json'

      - name: Check version consistency (installed)
        run: '"$WHEEL_PY" scripts/check_version.py --installed'

  extension:
    name: extension launch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Launch the server like the Claude Desktop extension
        # Same command as manifest.json server.mcp_config, with uv's default Python
        # selection (.python-version) and the committed uv.lock.
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          uv run --no-project --with "mcp>=2,<3" python scripts/smoke_mcp.py \
            --expect-version "$version" --manifest manifest.json \
            --server-command "uv run --directory . --no-dev extension_server.py"
