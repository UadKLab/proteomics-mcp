[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proteomics-mcp"
version = "0.1.10"
description = "Spectrum-level proteomics scoring tools exposed through CLI and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Simon Nándor Sugár"},
  {name = "Jeroen van Goey"},
  {name = "Alexey Nesterovich"},
  {name = "Isaac H.J. Houngue"},
  {name = "Marco Reverenna"},
  {name = "Chiara Francavilla"},
  {name = "Konstantinos Kalogeropoulos"},
]
keywords = ["proteomics", "mass spectrometry", "MCP", "MS2", "peptide-spectrum matches"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2",
  "pyarrow>=15",
  "pydantic>=2",
  "mcp>=2,<3",
  "ms2pip>=4.1",
  "pyopenms>=3.3",
  "pyteomics>=4.7",
  "spectrum-utils>=0.4",
  "plotly>=5",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "openpyxl>=3.1.5",
  "alphatims>=1.1.1",
]

[project.urls]
Homepage = "https://github.com/UadKLab/proteomics-mcp"
Repository = "https://github.com/UadKLab/proteomics-mcp"
Issues = "https://github.com/UadKLab/proteomics-mcp/issues"
Documentation = "https://uadklab.github.io/proteomics-mcp/"
Changelog = "https://github.com/UadKLab/proteomics-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
proteomics-mcp = "proteomics_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
# Runtime files under src/proteomics_mcp must be listed explicitly in
# [tool.setuptools.package-data]; scripts/check_wheel.py fails otherwise.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "network: needs network access, e.g. MS2PIP model download on first use; deselect with -m \"not network\"",
  "e2e: end-to-end verification of the installed package on public data (tests/e2e); deselected unless -m mentions e2e",
]

# pytest --cov measures this; CI runs it on one test leg and fails below fail_under (#166)
[tool.coverage.run]
source_pkgs = ["proteomics_mcp"]
branch = true

[tool.coverage.report]
fail_under = 88
sort = "cover"
skip_empty = true
